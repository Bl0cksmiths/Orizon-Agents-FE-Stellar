# SonarQube / SonarCloud analysis of the Orizon Agents frontend.
sonar.projectKey=Bl0cksmiths_Orizon-Agents-FE-Stellar
sonar.projectName=Orizon Agents FE (Stellar)
sonar.sourceEncoding=UTF-8

# The code the site ships, and the scripts that build and check it. The two
# root files are named as well: middleware.ts runs the BotID guard on every
# guarded request, and next.config.mjs sets the security headers (CSP), so
# leaving them out would hide the code most worth scanning.
sonar.sources=app,components,lib,scripts,middleware.ts,next.config.mjs

# Tests: the vitest suites beside the code (*.test.ts, *.test.tsx), the
# node:test suites in scripts/ (*.test.mjs), the Playwright suites and their
# fake servers in e2e/, and the shared helpers in test/. Read from the whole
# checkout, then narrowed by the inclusions.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,e2e/**,test/**

# Not code to scan:
#   - the test files, which sit inside the source folders: a file may be
#     indexed only once, so they leave the sources and count as tests;
#   - scripts/guide-samples/fixtures/: sample inputs for the guide checker;
#   - output and static files, outside the sources today and listed so a
#     wider sonar.sources cannot pull them in:
#       litepaper/**/*.html  rendered by litepaper/build/render_html.py
#                            (make html); lib/litepaper/source.mjs only
#                            reads and checks it;
#       Week-*-Tranche-Submission/  grant submission pages and evidence;
#       public/   static assets, plus the litepaper files that
#                 scripts/litepaper-assets.mjs copies in at build;
#       .next/    Next's build output; coverage/  vitest's reports.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,\
  scripts/guide-samples/fixtures/**,\
  litepaper/**/*.html,\
  Week-*-Tranche-Submission/**,\
  public/**,\
  .next/**,\
  coverage/**
# test/fixtures/ holds fake content (guides, demo, evidence, a tiny
# litepaper) that the suites read, not tests to analyse; node_modules/ is
# third-party code that `sonar.tests=.` would otherwise reach.
sonar.test.exclusions=test/fixtures/**,node_modules/**

# Coverage: the lcov report that `npm run test:coverage` writes (vitest's
# lcov reporter, vitest.config.ts). It covers what the unit suite gates, the
# lib layer; pages and components are exercised by Playwright, which writes
# no coverage, so they read as uncovered here.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
