    <script>

        document

            div.className = "mermaid";
            div.innerHTML =
              '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="20" role="img" aria-label="diagram"><rect width="80" height="20" fill="#5A2EFF"></rect></svg>';
            code.closest("pre").replaceWith(div);
          });
        document.body.setAttribute("data-mermaid-ready", "true");
      })();
